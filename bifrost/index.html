<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#828B8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bifröst">
<title>Bifröst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --bg:#0B1224; --card:#131D33; --line:#23304A; --track:#22304B; --chip:#1B2740;
  --ink:#E3EEE6; --muted:#9AAEC0; --teal:#3CCFC0; --aqua:#5FE0A6; --cyan:#3CCFC0;
  --plum:#8E5FC9; --rose:#D46FB0; --sand:#D9A766; --violet:#9A7CF0; --bleu:#5AA9FF;
  --aurore:linear-gradient(90deg,#5FE0A6 0%,#3CCFC0 25%,#5AA9FF 50%,#9A7CF0 75%,#D46FB0 100%);
  --crepuscule:linear-gradient(90deg,#5AA9FF 0%,#7F8CF5 40%,#9A7CF0 65%,#D46FB0 100%);
  --serif:'Cinzel', Georgia, serif; --rune:'Uncial Antiqua', 'Cinzel', serif; --sans:'DM Sans', system-ui, -apple-system, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@font-face{font-family:'Uncial Antiqua';src:url(fonts/uncial.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Cinzel';src:url(fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-display:swap}
body{background-color:var(--bg);background-image:
  linear-gradient(160deg,transparent 8%,rgba(95,224,166,.10) 20%,transparent 34%),
  linear-gradient(150deg,transparent 22%,rgba(90,169,255,.12) 36%,transparent 50%),
  linear-gradient(140deg,transparent 40%,rgba(154,124,240,.13) 54%,transparent 68%),
  linear-gradient(135deg,transparent 60%,rgba(212,111,176,.08) 74%,transparent 88%);
  background-attachment:fixed;background-repeat:no-repeat;min-height:100vh}
html{background:var(--bg)}
.h-title,h1{font-family:var(--rune)!important;font-weight:400!important;background:var(--crepuscule);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
h2,h3,.h-sec{font-family:var(--serif);font-weight:700;letter-spacing:.02em}
.card,.list,.htile,.nav{border:1px solid rgba(90,169,255,.10)}
.nav{background:rgba(19,29,51,.92)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav::before{content:'';position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:2px;background:var(--aurore);opacity:.55}
.nav .fab{background:var(--aurore)!important;color:#0B1224!important;box-shadow:0 0 0 4px rgba(11,18,36,.9),0 6px 22px rgba(95,224,166,.35)!important}
.btn-main{background:linear-gradient(90deg,#2FB39E,#3CCFC0 45%,#5AA9FF)!important;color:#08111F!important;font-weight:700}
input,textarea,select{color-scheme:dark}
::selection{background:rgba(154,124,240,.30)}
.bifrost-logo{position:relative;filter:drop-shadow(0 0 22px rgba(95,224,166,.25))}
.login .muted{line-height:1.5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.screen{padding:calc(var(--safe-top) + 28px) 20px calc(var(--safe-bottom) + 120px);display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border-radius:22px}
.h-title{font-size:36px;line-height:1.05}
.h-sec{font-size:22px}
.link{background:none;border:0;color:var(--teal);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* header */
.today-head{display:flex;justify-content:space-between;align-items:center;gap:14px}
.theme-name{display:flex;align-items:center;gap:10px}
.dayring{position:relative;width:88px;height:88px;flex-shrink:0;border:0;background:none;padding:0}
.dayring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dayring .big{font-family:var(--serif);font-weight:600;font-size:22px}
.dayring .small{font-size:11px;color:var(--muted)}
.dayring.full svg{animation:pulse 1.4s ease-out 1}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}

/* one thing */
.one{background:var(--plum);color:#2F3644;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.one .eyebrow{color:#F6DDEC}
.one p{margin:0;font-family:var(--serif);font-size:21px;line-height:1.3}
.one.done{background:#5E8F86}
.one.done p{text-decoration:line-through;text-decoration-thickness:1px;opacity:.85}
.one .sub{font-size:13px;color:#F6DDEC}
.pill-btn{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:#131D33;color:var(--plum);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.one-empty{border:1.5px dashed #292A3C;border-radius:24px;padding:18px 20px;background:transparent;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--plum)}
.one-empty strong{font-family:var(--serif);font-size:19px}

/* habit grid */
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.htile{background:var(--card);border-radius:20px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;position:relative}
.htile .ringbtn{border:0;background:none;padding:0;position:relative;width:66px;height:66px;display:block}
.htile .ringbtn .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.htile .name{font-size:14px;font-weight:700;text-align:center;line-height:1.2;border:0;background:none;padding:4px 2px;min-height:30px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htile .val{font-size:12px;color:var(--muted)}
.htile .val.ok{color:var(--teal);font-weight:700}
.htile.add{border:1.5px dashed #33415E;background:transparent;justify-content:center;color:var(--muted);font-size:13px;font-weight:500;min-height:132px}
.htile .badge{position:absolute;top:8px;right:8px;font-size:10px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 6px}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* book */
.book{padding:16px;display:flex;gap:14px;align-items:center;border:0;text-align:left;width:100%}
.book img{width:58px;height:80px;object-fit:cover;object-position:left top;border-radius:8px;flex-shrink:0}
.bar{height:6px;background:var(--track);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--rose);border-radius:999px}

/* list */
.list{background:var(--card);border-radius:20px;display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 4px 18px;min-height:52px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li span{font-size:15px;flex:1;min-width:0}
.li .act{min-height:44px;padding:0 10px;border:0;background:none;color:var(--teal);font-weight:600;font-size:13px;white-space:nowrap}
.li .del{color:var(--muted)}

.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stile{background:var(--card);border:1px solid rgba(90,169,255,.10);border-radius:18px;min-height:64px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.stile svg{color:var(--aqua);flex-shrink:0}
.seed{padding:16px;display:flex;flex-direction:column;gap:10px}
.seed textarea{min-height:84px;resize:vertical}
.seedbtn{background:var(--aurore)!important;color:#0B1224!important}
.idea{padding:18px;display:flex;flex-direction:column;gap:10px}
.idea-t{font-family:var(--serif);font-size:19px;line-height:1.3;margin:0;color:#C9D8F2}
.md{font-size:15px;line-height:1.6;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.md p{margin:0}.md ul{margin:0;padding-left:20px}.md h3{font-size:16px;margin:6px 0 0;color:var(--violet)}
.md b{color:#F1E9FF}.md i{color:var(--muted)}.md code{background:var(--chip);padding:1px 5px;border-radius:6px;font-size:13px}
.md .wl{color:var(--cyan)}
.md .callout{border-left:3px solid var(--aqua);background:rgba(95,224,166,.07);border-radius:0 12px 12px 0;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.favlink{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:1;min-height:48px;font-size:15px}
.favlink svg{color:var(--violet);flex-shrink:0}
.addfav{border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.addfav small{display:block;color:var(--muted);font-size:12px}
.dgrid{columns:1;column-gap:16px}
.dblock{break-inside:avoid;margin:0 0 16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.djour{flex-direction:row;align-items:center;gap:14px;cursor:pointer}
.cov{border-radius:14px;background:var(--chip) center/cover no-repeat;flex-shrink:0}
.cov.wide{width:100%;aspect-ratio:2.6}
.cov.side{width:64px;height:84px}
.lrow{display:flex;gap:12px;align-items:center}
.qtext{margin:0;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.35;color:#C9D8F2}
.ex{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;min-height:28px}
.tag.on{background:var(--aqua);color:#0B1224;font-weight:700}
.mini{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;color:var(--teal);font-weight:600;font-size:13px;text-decoration:none;min-height:36px}
.md.clip{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.prow{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.prow a{color:var(--cyan);text-decoration:none}.ptitle{font-weight:600;font-size:14px;color:var(--ink)!important}
.dlist{display:flex;flex-direction:column}
.dlist a,.frow{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.frow a{border:0;flex:1}.dlist>:last-child{border-bottom:0}
.dlist .av{min-width:22px}.dlist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--chip);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font-family:var(--serif);font-size:22px}.stats span{font-size:12px;color:var(--muted)}
@media (min-width:760px){
  body.wideview #app{max-width:1180px}
  body.wideview .screen{padding-left:28px;padding-right:28px}
  .dgrid{columns:2 340px}
}
@media (min-width:1100px){ .dgrid{columns:3 320px} }
#sidesync{display:none}
@media (min-width:620px){ #sidesync{display:flex;position:fixed;top:calc(var(--safe-top) + 30px);left:calc(50% + 256px);z-index:20} #sidesync[hidden]{display:none} }
#aurora{position:fixed;left:0;right:0;top:0;height:calc(var(--safe-top) + 120px);z-index:40;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .45s ease;-webkit-transform:translateZ(0);
  -webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.75) 45%,transparent 100%);mask-image:linear-gradient(#000 0%,rgba(0,0,0,.75) 45%,transparent 100%)}
#aurora i{position:absolute;left:-30%;right:-30%;top:calc(-60px + var(--k,0) * 40px);height:150px;filter:blur(18px);border-radius:50%;
  background:linear-gradient(90deg,transparent 0%,#5FE0A6 14%,#3CCFC0 30%,#5AA9FF 50%,#9A7CF0 68%,#D46FB0 84%,transparent 100%);background-size:200% 100%;
  transform:scaleY(calc(.35 + var(--k,0) * .65)) skewX(-8deg);transform-origin:top;transition:transform .2s ease,top .2s ease}
#aurora i:nth-child(2){top:calc(-80px + var(--k,0) * 55px);opacity:.55;filter:blur(26px);background-position:60% 0;transform:scaleY(calc(.3 + var(--k,0) * .7)) skewX(10deg)}
#aurora i:nth-child(3){top:calc(-70px + var(--k,0) * 30px);opacity:.4;height:110px;background:linear-gradient(90deg,transparent,#9A7CF0 25%,#5FE0A6 55%,#5AA9FF 80%,transparent);background-size:200% 100%}
#aurora.ready{--k:1.08}
#aurora.live i{animation:aurflow 3.2s ease-in-out infinite alternate, aurwave 2.4s ease-in-out infinite}
#aurora.live i:nth-child(2){animation-duration:4.4s,3.1s;animation-direction:alternate-reverse,normal}
#aurora.live i:nth-child(3){animation-duration:5.2s,2.7s}
@keyframes aurflow{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes aurwave{0%,100%{opacity:.95;margin-top:0}50%{opacity:.6;margin-top:10px}}
@media (prefers-reduced-motion:reduce){#aurora.live i{animation:none}}
.dlist button,.frow button{background:none;border:0;padding:0;font:inherit;text-align:left;width:100%;display:flex;align-items:center;gap:10px;min-height:42px;color:var(--ink);font-size:14px;cursor:pointer}
.dlist>button{border-bottom:1px solid var(--line)}.dlist>button:last-child{border-bottom:0}
button.wl{background:none;border:0;padding:0;font:inherit;color:var(--cyan);cursor:pointer;text-align:inherit}
button.mini{background:none;border:0;padding:0;cursor:pointer}
.pas textarea{min-height:64px}
.pas.done p{font-size:15px}
.pascard{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:1px solid rgba(95,224,166,.25);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.pascard svg:first-child{color:var(--aqua)}.pascard span{flex:1}
.search{display:flex;flex-direction:column;gap:10px}
.sbox{position:relative}.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.sbox input{padding-left:42px;width:100%}
.sres{padding:4px 0;display:flex;flex-direction:column}
.srow{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:12px 16px;display:flex;flex-direction:column;gap:3px;color:var(--ink);font:inherit;cursor:pointer}
.srow:last-child{border-bottom:0}.srow .nm{font-weight:600;font-size:15px}.srow small{color:var(--muted);font-size:12px;line-height:1.4}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.dw.sunday{border-color:rgba(154,124,240,.45)}
#sheet .sheet:has(.reader){max-width:760px}
.reader{display:flex;flex-direction:column;gap:12px}
.reader-t{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.3;margin:0;color:#C9D8F2}
.avisbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.avisbar button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:8px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:20px;cursor:pointer}
.avisbar button span{font-size:10px;line-height:1.1;text-align:center}
.avisbar button.on{border-color:var(--aqua);background:rgba(95,224,166,.12);color:var(--ink)}
.avisbar button.busy{opacity:.5}
.md.full{gap:10px}.md.full h3{font-size:17px}.md.full h4{font-size:15px;margin:4px 0 0;color:var(--cyan)}
.md img{max-width:100%;border-radius:12px}.md .imgwait{display:block;height:120px;border-radius:12px;background:var(--chip)}
.md pre{white-space:pre-wrap;background:var(--chip);padding:10px 12px;border-radius:12px;font-size:13px;margin:0}
.md details.callout summary{cursor:pointer;font-weight:600;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);width:100%}
.md .tbl{overflow-x:auto}.md table{border-collapse:collapse;font-size:13px}.md td,.md th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.md a{color:var(--cyan)}
@media (min-width:1000px){ body.duoview #sidesync{left:auto;right:20px} body.duoview #app{max-width:1060px} .duo{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start} .duo .seg{display:none} }
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);width:min(456px,calc(100% - 24px));bottom:calc(var(--safe-bottom) + 12px);height:72px;background:var(--card);border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.24);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;z-index:20}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:-.015em;white-space:nowrap;color:var(--muted);min-height:48px;justify-content:center}
.nav button.on{color:var(--teal);font-weight:700}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#2F3644;margin:-28px auto 0;box-shadow:0 6px 16px rgba(60,207,192,.32)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:999px;padding:4px}
.seg button{border:0;background:none;min-height:40px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);padding:0 16px;min-height:36px;border-radius:999px;font-size:13px;display:inline-flex;align-items:center}
.chip.on{background:var(--teal);color:#2F3644;font-weight:700}
.tag{padding:4px 10px;border-radius:999px;font-size:12px}
.tag.done{text-decoration:line-through;opacity:.7}

/* week */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:14px 8px}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;border-radius:14px;padding:4px 0;border:0;background:none}
.strip .d.today{background:#303444;color:var(--plum);font-weight:700}
.daycard{padding:14px 16px;display:flex;gap:14px;align-items:flex-start;border:0;text-align:left;width:100%}
.daycard .band{width:6px;align-self:stretch;border-radius:999px}
.daycard .body{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.daycard .t{font-family:var(--serif);font-size:18px;font-weight:600}
.daycard.past{opacity:.72}
.daycard.today{box-shadow:0 0 0 2px var(--rose)}

/* routines */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--serif);font-size:24px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,20px) 42px;align-items:center;gap:4px}
.rhead{font-size:11px;color:var(--muted);text-align:center}
.rrow{background:var(--card);border-radius:20px;padding:12px 14px;border:0;width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.rweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;padding-left:48px;padding-right:4px}
.rhead.rweek{padding-left:62px;padding-right:18px}
.rrow .who{display:flex;align-items:center;gap:10px;min-width:0}
.rrow .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rrow .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .mt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;justify-self:center}
.dash{width:6px;height:2px;background:#2C3A57;justify-self:center}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat span{aspect-ratio:1;border-radius:6px;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* focus */
.focus{min-height:100vh;background:#2E3544;padding:calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 30px);display:flex;flex-direction:column;align-items:center;gap:26px}
.focus .ringbig{position:relative;width:280px;height:280px}
.focus .ringbig .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.focus .clock{font-family:var(--serif);font-size:58px;letter-spacing:-.02em}
.round{width:56px;height:56px;border-radius:50%;border:0;background:#313643;font-weight:700}
.primary{min-width:150px;height:64px;border-radius:999px;border:0;background:var(--teal);color:#2F3644;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 24px}
.focus .streak{width:100%;background:#313643;border-radius:22px;padding:16px 18px;margin-top:auto}

/* sport */
.circuit{background:#8BB3B4;color:#2F3644;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.circuit .eyebrow{color:#2A3444}
.ex{padding:8px 14px 8px 8px;display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left}
.ex img{width:60px;height:60px;border-radius:14px;object-fit:cover;background:#EAF4EE;flex-shrink:0}
.sdays{display:flex;gap:8px}
.sdays span{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--cyan);color:#8BB3B4}
.sdays span.ok{background:var(--cyan);color:#2F3644}
.runner{min-height:100vh;background:var(--bg);padding:calc(var(--safe-top) + 20px) 22px calc(var(--safe-bottom) + 30px);display:flex;flex-direction:column;gap:20px}
.runner .pic{background:#EAF4EE;border-radius:28px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.runner .pic img{width:100%;height:100%;object-fit:contain}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.60);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--safe-bottom) + 24px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:999px;background:#2C3A57;margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:13px;color:var(--muted);font-weight:500}
.input{border:0;background:var(--card);border-radius:16px;min-height:52px;padding:12px 16px;font-size:17px;width:100%;outline:none}
.input:focus{box-shadow:0 0 0 2px var(--aqua)}
textarea.input{min-height:90px;resize:none}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icons button{height:48px;border-radius:14px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center}
.icons button.on{background:var(--teal);color:#2F3644}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd button{height:44px;border-radius:12px;border:0;background:var(--card);font-weight:700;font-size:13px}
.wd button.on{background:var(--teal);color:#2F3644}
.btn-main{min-height:54px;border:0;border-radius:999px;background:var(--teal);color:#2F3644;font-weight:700;font-size:16px;width:100%}
.btn-soft{min-height:50px;border:0;border-radius:999px;background:var(--card);color:var(--teal);font-weight:700;font-size:15px;width:100%}
.btn-danger{min-height:44px;border:0;background:none;color:#F07A8E;font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);font-size:22px;font-weight:700;color:var(--teal)}
.stepper b{font-family:var(--serif);font-size:28px;min-width:60px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 14px);max-width:calc(100% - 40px);text-align:center;background:var(--ink);color:#2F3644;padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;animation:up .25s}
input[type=range]{width:100%;accent-color:var(--rose)}

/* méditation */
.nav .live{position:absolute;top:4px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--card)}
.stage{padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.orbwrap{position:relative;width:236px;height:236px;display:flex;align-items:center;justify-content:center}
.halo{position:absolute;inset:0;border-radius:50%;opacity:.55}
.orb{position:relative;width:186px;height:186px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#131D33 0%,var(--t) 42%,var(--c) 135%);box-shadow:0 12px 32px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:18px;will-change:transform}
.orb .on{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15;color:var(--ink)}
.orb .on em{display:block;font-style:normal;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.orb .tm{font-size:15px;color:var(--ink);opacity:.7;font-variant-numeric:tabular-nums}
.orb.idle{animation:idle 7s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.hint{margin:0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:center}
.medit input[type=range]{accent-color:var(--teal);height:30px;margin:0}
.sl{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:500}
.sl b{font-size:13px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.mpanel,.layer{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.layer h3{font-size:18px}
.layer .sub{font-size:12px;color:var(--muted)}
.layer.off .sl,.layer.off .chips{opacity:.38}
.tog{width:52px;height:32px;border-radius:999px;border:0;background:var(--track);position:relative;flex-shrink:0;transition:background .2s}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#131D33;box-shadow:0 1px 3px rgba(0,0,0,.40);transition:transform .2s}
.tog.on{background:var(--teal)}
.tog.on i{transform:translateX(20px)}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acard{background:var(--card);border-radius:20px;display:flex}
.acard.cur{box-shadow:0 0 0 2px var(--c)}
.amain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:14px 4px 14px 14px;display:flex;flex-direction:column;gap:6px}
.adot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#131D33,var(--t) 48%,var(--c) 135%)}
.anm{font-family:var(--serif);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ads{font-size:11.5px;color:var(--muted);line-height:1.35}
.amore{border:0;background:none;width:40px;min-height:44px;color:var(--muted);align-self:flex-start;display:flex;align-items:center;justify-content:center;padding-top:6px}
.acard.add{border:1.5px dashed #33415E;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-size:13px;min-height:110px}

/* to-do */
.axis{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcell{border:0;text-align:left;background:var(--t);border-radius:22px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px;min-height:168px;position:relative;overflow:hidden}
.qcell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.qcell .qn{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.15;color:var(--k)}
.qcell .qc{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--k);line-height:1}
.qcell .qs{font-size:11px;color:var(--muted)}
.qcell .ql{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.qcell .ql span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;position:relative}
.qcell .ql span::before{content:"";position:absolute;left:0;top:.55em;width:4px;height:4px;border-radius:50%;background:var(--c)}
.qcell .ql .more{color:var(--muted);font-size:12px}
.qcell .ql .more::before{display:none}
.tdrow{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;min-height:56px;border-bottom:1px solid var(--line)}
.tdrow:last-child{border-bottom:0}
.tdchk{width:44px;height:44px;border:0;background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
.tdchk::before{content:"";position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid #33415E;box-sizing:border-box}
.tdchk.on::before{background:var(--teal);border-color:var(--teal)}
.tdchk svg{position:relative}
.tdtxt{flex:1;min-width:0;border:0;background:none;text-align:left;font-size:15px;padding:10px 4px;line-height:1.3}
.tdrow.done .tdtxt{text-decoration:line-through;color:var(--muted)}
.mini{display:grid;grid-template-columns:22px 22px;grid-template-rows:22px 22px;gap:3px;flex-shrink:0;padding:2px}
.mini button{border:0;border-radius:6px;padding:0;opacity:.85}
.mini button:active{transform:scale(.9);opacity:1}
.qhead{display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--c);padding-left:14px}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qpick button{border:2px solid transparent;background:var(--t);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.qpick button b{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--k)}
.qpick button span{font-size:11px;color:var(--muted)}
.qpick button.on{border-color:var(--c)}
.qdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;flex-shrink:0}

/* bibliothèque sport */
.gscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.gcard{flex:0 0 auto;width:86px;border:0;background:var(--card);border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.gcard img,.gcard .allic{width:74px;height:74px;border-radius:13px;object-fit:cover;background:#EAF4EE;display:flex;align-items:center;justify-content:center;color:#8BB3B4}
.gcard .allic{background:#2E3645}
.gcard small{font-size:11px;color:var(--muted);font-weight:500}
.gcard.on{background:#8BB3B4;color:#2F3644}
.gcard.on small{color:#2A3444}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lcard{position:relative;border:0;background:var(--card);border-radius:20px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:3px;text-align:left}
.lcard img{width:100%;aspect-ratio:1;object-fit:contain;background:#EAF4EE;border-radius:14px;margin-bottom:6px}
.lcard .ln{font-size:14px;font-weight:700;line-height:1.2;padding:0 4px}
.lcard .lg{font-size:11px;color:var(--muted);padding:0 4px}
.lcard .inc{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--cyan);display:flex;align-items:center;justify-content:center}
.libpic{background:#EAF4EE;border-radius:24px;overflow:hidden;aspect-ratio:1;max-height:42vh;display:flex;align-items:center;justify-content:center}
.libpic img{width:100%;height:100%;object-fit:contain}
/* mesures */
.mstats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.mstats div{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.mstats b{font-family:var(--serif);font-size:22px;font-weight:600}
.mstats span{font-size:11px;color:var(--muted)}
/* journal */
.jcard{padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,var(--card),#313544)}
.jprev{display:flex;flex-direction:column;gap:8px}
.jprev span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jprev p{margin:2px 0 0;font-family:var(--serif);font-size:16px;line-height:1.35}
.jentry{border:0;text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.jentry .jl{font-size:14px;line-height:1.4}
.jentry .jl b{display:block;font-size:11px;color:var(--muted);font-weight:500}

/* sport : programmes, historique */
.pscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;border:0;background:var(--card);border-radius:999px;min-height:42px;padding:0 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.pchip small{font-size:11px;font-weight:600;background:var(--t);color:var(--c);border-radius:999px;padding:2px 7px}
.pchip.on{background:var(--c);color:#2F3644}
.pchip.on small{background:rgba(251,246,236,.22);color:#2F3644}
.pchip.add{background:transparent;border:1.5px dashed #33415E;color:var(--muted);font-weight:600}
.li.sess{border:0;background:none;width:100%;text-align:left;padding:10px 12px 10px 18px;font:inherit;color:inherit}
.li.sess b{font-size:15px}
.li.sess small{font-size:12px}
/* respirer */
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bcard{border:2px solid transparent;background:var(--card);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.bcard.on{background:var(--t);border-color:var(--c)}
.bcard .bn{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--k)}
.bcard .bs{font-size:13px;font-weight:700;color:var(--ink)}
.bcard .bd{font-size:12px;color:var(--muted);line-height:1.35}
.phbar{display:flex;gap:3px;height:6px}
.phbar i{border-radius:999px}
.bstep{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line)}
.bstep:last-child{border-bottom:0}
.bstep>span{font-size:15px;font-weight:600}
.bstep .stepper b{font-size:22px;min-width:56px}
.bstep .stepper button{width:44px;height:44px}
.breathe{min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--t));padding:calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 40px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:24px}
.borb{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
.borb .halo{position:absolute;inset:0;border-radius:50%;background:var(--card);opacity:.6}
.borb .bo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#131D33 0%,var(--t) 40%,var(--c) 140%);box-shadow:0 14px 40px rgba(0,0,0,.36);transform:scale(.42);will-change:transform}
.borb .blbl{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.borb .blbl span{font-family:var(--serif);font-size:30px;font-weight:600}
.borb .blbl b{font-size:18px;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums;min-height:22px}
.bdone{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
/* notes */
.ncomp{padding:12px;display:flex;flex-direction:column;gap:10px}
.ncomp textarea{background:var(--bg);min-height:84px}
.jlink{border:0;display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%}
.jlink .ico{width:40px;height:40px;border-radius:12px;background:#303444;display:flex;align-items:center;justify-content:center}
.nlist{display:flex;flex-direction:column;gap:10px}
.note{border:0;text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.note b{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.25}
.note .nb{font-size:14px;color:var(--ink);opacity:.85;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.note .nw{font-size:11px;color:var(--muted)}

/* connexion & sauvegarde */
.login{min-height:100vh;max-width:420px;margin:0 auto;padding:calc(var(--safe-top) + 60px) 28px calc(var(--safe-bottom) + 40px);display:flex;flex-direction:column;align-items:center;gap:16px}
.login .logo{position:relative;width:96px;height:96px;margin-bottom:6px}
.login .logo span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--aqua)}
.sdot.wait{background:var(--sand)}
.sdot.bad{background:#F07A8E}

/* objectifs */
.gadd{border:1.5px dashed #33415E;background:transparent;border-radius:20px;min-height:56px;color:var(--teal);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.gcardo{background:var(--card);border-radius:20px;overflow:hidden;border-left:5px solid var(--c)}
.gmain{border:0;background:none;width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 16px}
.gring{position:relative;width:52px;height:52px;flex-shrink:0}
.gring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--k)}
.gt{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.2}
.gw{font-size:13px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gm{font-size:12px;color:var(--k);font-weight:600}
.gnext{display:flex;align-items:center;gap:4px;padding:2px 12px 10px 8px;background:var(--t)}
.gnext span{font-size:14px;line-height:1.3;padding:8px 0}
.gnext small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* tcc */
.tdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tdays button{border:0;border-radius:14px;min-height:54px;background:rgba(251,246,236,.14);color:#2F3644;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:0}
.tdays button b{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;min-height:18px}
.tdays button.on{background:#131D33;color:var(--plum)}
.tdays button.today{box-shadow:0 0 0 2px #131D33}
.tdays button:disabled{opacity:.35}
.tplan .tp{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.tp .mk{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted)}
.tp.cur .mk{background:var(--teal);color:#2F3644}
.tp.done .mk{background:var(--aqua);color:#2F3644}
.tp .tt{font-weight:700;font-size:15px}
.tp .td{font-size:12px;color:var(--muted);line-height:1.35}
.tp.cur .tt{color:var(--teal)}
.tp.fut{opacity:.62}
.tflow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.tflow span{background:var(--t);color:var(--k);border-radius:999px;padding:5px 10px;font-weight:700}
.tflow i{font-style:normal;color:var(--muted)}
.tloop{border:0;text-align:left;width:100%;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.tloop .tlt{font-family:var(--serif);font-size:19px;font-weight:600}
.tchain{display:flex;flex-direction:column}
.tstage{display:block;position:relative;padding:0 0 12px 24px}
.tstage::before{content:"";position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tstage::after{content:"";position:absolute;left:7px;top:17px;bottom:1px;width:2px;background:var(--line)}
.tstage:last-child{padding-bottom:0}
.tstage:last-child::after{display:none}
.tstage b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tstage span{display:block;font-size:14px;line-height:1.4;margin-top:2px}
.tstage span.empty{color:var(--muted);font-style:italic}
.asrs{min-height:100vh;padding:calc(var(--safe-top) + 20px) 22px calc(var(--safe-bottom) + 30px);display:flex;flex-direction:column;gap:20px}
.asrs .q{margin:0;font-family:var(--serif);font-size:24px;line-height:1.3;font-weight:600}
.aprog{height:6px;background:var(--track);border-radius:999px;overflow:hidden}
.aprog i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .25s}
.aopts{display:flex;flex-direction:column;gap:10px}
.aopts button{min-height:58px;border:0;border-radius:18px;background:var(--card);font-size:16px;font-weight:600;text-align:left;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.aopts button.on{background:var(--teal);color:#2F3644}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

</style>

function ring(size, r, sw, pct, color, track = '#22304B', label = '') {
  const c = size / 2, p = Math.max(0, Math.min(1, pct)) * 100;
  const arc = p > 0 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" pathLength="100" stroke-dasharray="${p.toFixed(2)} 100" transform="rotate(-90 ${c} ${c})" style="transition:stroke-dasharray .4s ease"/>` : '';
  const aria = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" ${aria}><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/>${arc}</svg>`;
}

/* ---------- dates (la journée bascule à 4 h) ---------- */
const pad = n => String(n).padStart(2, '0');
function logicalNow() { return new Date(Date.now() - D.settings.dayStart * 3600e3); }
function dkey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function wd(d) { return (d.getDay() + 6) % 7; }
function todayKey() { return dkey(logicalNow()); }
function weekStart(d) { return addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -wd(d)); }

/* ---------- habitudes ---------- */
const active = () => D.habits.filter(h => !h.archived);
const hById = id => D.habits.find(h => h.id === id);
function val(k, h) { return (D.logs[k] && D.logs[k][h.id]) || 0; }
function setVal(k, h, v) { D.logs[k] = D.logs[k] || {}; if (v <= 0) delete D.logs[k][h.id]; else D.logs[k][h.id] = v; }
function prog(k, h) { return Math.min(1, val(k, h) / (h.target || 1)); }
function done(k, h) { return val(k, h) >= (h.target || 1); }
function periodKeys(h, d) {
  const out = [];
  if (h.freq === 'weekly') { const s = weekStart(d); for (let i = 0; i < 7; i++) out.push(dkey(addDays(s, i))); }
  else if (h.freq === 'monthly') { const n = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); for (let i = 1; i <= n; i++) out.push(dkey(new Date(d.getFullYear(), d.getMonth(), i))); }
  return out;
}
function periodCount(h, d) { return periodKeys(h, d).filter(k => done(k, h)).length; }
function scheduledOn(h, d) { return h.freq === 'days' && h.days.includes(wd(d)); }
function itemsFor(k) {
  const d = fromKey(k), isToday = k === todayKey();
  if (D.since && k < D.since) return [];
  return active().filter(h => {
    if (h.freq === 'days') return scheduledOn(h, d);
    if (!isToday) return false;
    if (done(k, h)) return true;
    if (h.freq === 'monthly' && d.getDate() < 25) return false;
    return periodCount(h, d) < (h.times || 1);
  });
}
function dayProgress(k) {
  const it = itemsFor(k);
  if (!it.length) return { pct: 0, done: 0, total: 0 };
  const sum = it.reduce((a, h) => a + prog(k, h), 0);
  return { pct: sum / it.length, done: it.filter(h => done(k, h)).length, total: it.length };
}
function streak(h) {
  if (h.freq !== 'days' || !h.days.length) return 0;
  let d = logicalNow(), n = 0, guard = 0;
  if (!done(dkey(d), h)) d = addDays(d, -1);
  while (guard++ < 400) {
    if (D.since && dkey(d) < D.since) break;
    if (scheduledOn(h, d)) { if (done(dkey(d), h)) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}
function freqLabel(h) {
  const ml = h.type === 'measure' ? mLast(h) : null;
  const unit = h.type === 'measure' ? (ml ? `${fmtNum(ml.v)} ${h.unit || ''} · ` : '') : h.type === 'time' ? `${h.target} min · ` : h.type === 'count' ? `${h.target} fois · ` : '';
  if (h.freq === 'weekly') return `${unit}${h.times || 1} × / semaine`;
  if (h.freq === 'monthly') return `${unit}${h.times || 1} × / mois`;
  if (h.days.length === 7) return `${unit}chaque jour`;
  return unit + h.days.map(i => WDS[i]).join(', ');
}
function valLabel(k, h) {
  if (h.type === 'measure') { const m = (D.measures[h.id] || {})[k]; return m !== undefined ? `${fmtNum(m)} ${h.unit || ''}` : done(k, h) ? 'Fait' : 'À noter'; }
  if (done(k, h)) return h.type === 'check' ? 'Fait' : (h.type === 'time' ? `${h.target} min ✓` : `${h.target} / ${h.target}`);
  if (h.type === 'time') return `${Math.floor(val(k, h))} / ${h.target} min`;
  if (h.type === 'count') return `${val(k, h)} / ${h.target}`;
  if (h.freq !== 'days') return h.freq === 'weekly' ? 'cette semaine' : 'ce mois-ci';
  return 'À faire';
}

const app = () => document.getElementById('app');
function render() {
  const scroll = window.scrollY;
  const prevView = render.view;
  let html = '';

  else if (S.view === 'focus') html = vFocus();
  else if (S.view === 'breath') html = vBreath();
  else if (S.view === 'run') html = vRun();
  else if (S.view === 'asrs') html = vAsrs();
  else {
    const duo = (S.view === 'today' || S.view === 'week') && window.innerWidth >= 1000;
    html = (duo ? `<div class="duo">${vToday()}${vWeek()}</div>` : { today: vToday, week: vWeek, serre: vSerre, routines: vRoutines, sport: vSport, medit: vMedit, tcc: vTcc, todo: vJournalTab }[S.view]()) + vNav();
    document.body.classList.toggle('duoview', duo);
  }
  document.body.classList.toggle('wideview', S.view === 'serre');
  if (!['today', 'week'].includes(S.view) || window.innerWidth < 1000) document.body.classList.remove('duoview');
  // bouton ⟳ dans la marge, pour l'ordinateur et l'iPad (l'onglet La Serre a le sien)
  let rb = document.getElementById('sidesync');
  if (!rb) { rb = document.createElement('button'); rb.id = 'sidesync'; rb.className = 'icon-btn'; rb.setAttribute('aria-label', 'Rafraîchir'); rb.dataset.a = 'side-refresh'; rb.innerHTML = ic('refresh', 20, 1.9); document.body.appendChild(rb); }
  rb.hidden = S.view === 'serre' || PTR_OFF.includes(S.view);
  // garder le champ en cours de saisie (et son curseur) quand la page se redessine
  const ae = document.activeElement, keep = ae && ae.id && app().contains(ae) && /^(INPUT|TEXTAREA)$/.test(ae.tagName) ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd, v: ae.value } : null;
  app().innerHTML = html;
  if (keep) { const n = document.getElementById(keep.id); if (n) { if (n.value !== keep.v && n.tagName === 'TEXTAREA') n.value = keep.v; n.focus({ preventScroll: true }); try { n.setSelectionRange(keep.a, keep.b); } catch (e) { } } }
  renderSheet();
  if (prevView === S.view) window.scrollTo(0, scroll); else window.scrollTo(0, 0);
  render.view = S.view;
}
function renderSheet() {
  let el = document.getElementById('sheet');
  if (!S.sheet) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; document.body.appendChild(el); }

  el.innerHTML = `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${fn()}</div></div>`;

}

function vNav() {

}

/* --- Aujourd'hui --- */
function vToday() {
  const now = logicalNow(), k = dkey(now), th = D.themes[wd(now)];

  const f = D.focus[k];
  const tk = dkey(addDays(now, 1)), tf = D.focus[tk];
  const items = itemsFor(k);
  const reading = D.books.find(b => b.status === 'reading');
  const sb = sortedBacklog(), bl = S.showAllBacklog ? sb : sb.slice(0, 3);

  const oneCard = f ? `
    <section class="one ${f.done ? 'done' : ''}">
      <span class="eyebrow">Ta seule chose aujourd'hui</span>

      <button class="pill-btn" data-a="one-done">${ic(f.done ? 'back' : 'check', 18, 2.2)}${f.done ? 'Annuler' : "C'est fait"}</button></div>

    <button class="one-empty" data-a="one-open" data-k="${k}"><span class="eyebrow" style="color:var(--plum)">Ta seule chose aujourd'hui</span><strong>Choisir le premier geste</strong><span style="font-size:13px">Une seule chose. Le mouvement physique qui la commence.</span></button>`;

      : `${ring(66, 27, 7, p, h.color)}<span class="ic">${ic(h.icon, 24, 1.8, INK[h.color] || h.color)}</span>`;
    const badge = h.freq === 'weekly' ? `<span class="badge">${periodCount(h, now)}/${h.times || 1} sem.</span>` : h.freq === 'monthly' ? `<span class="badge">mois</span>` : '';
    return `<div class="htile" id="t_${h.id}">${badge}
      <button class="ringbtn" data-a="ring" data-id="${h.id}" aria-label="${esc(h.name)} : ${esc(valLabel(k, h))}">${inner}</button>
      <button class="name" data-a="hlog" data-id="${h.id}">${esc(h.name)}</button>

  }).join('');

  const book = reading ? `

      ${bookCover(reading)}
      <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
        <span class="eyebrow">Lecture en cours</span>
        <span style="font-family:var(--serif);font-size:18px;font-weight:600">${esc(reading.title)}</span>
        <div class="bar"><i style="width:${reading.progress}%"></i></div>
        <span class="muted" style="font-size:12px">${reading.progress} %</span>
      </div></button>` : `<button class="card book" data-a="books"><span class="muted">Aucune lecture en cours. Choisir un livre</span></button>`;

  return `<main class="screen">

      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span class="eyebrow">${WDN[wd(now)]} ${now.getDate()} ${MONTHS[now.getMonth()]}</span>

      </div>
      <div class="dayring ${full ? 'full' : ''}">${ring(88, 35, 9, dp.pct, th.color, '#22304B', `Journée à ${Math.round(dp.pct * 100)} %`)}
        <div class="lbl"><span class="big">${dp.done}/${dp.total}</span><span class="small">routines</span></div></div>

    <section style="display:flex;flex-direction:column;gap:14px">

    <section style="display:flex;flex-direction:column;gap:12px">
      <div><h2 class="h-sec">Envie d'en faire plus ?</h2><span class="muted" style="font-size:14px">Les priorités de ta to-do d'abord, sans obligation.</span></div>
      ${D.backlog.length ? `<div class="list">${bl.map(b => `<div class="li"><span>${qDot(b)}${esc(b.text)}</span>
        ${S.showAllBacklog ? `<button class="act del" data-a="bl-del" data-id="${b.id}" aria-label="Supprimer ${esc(b.text)}">Suppr.</button>` : ''}
        <button class="act" data-a="bl-tomorrow" data-id="${b.id}">Pour demain</button></div>`).join('')}</div>
        ${D.backlog.length > 3 ? `<button class="link" data-a="bl-all" style="align-self:flex-start">${S.showAllBacklog ? 'Réduire' : `Tout voir (${D.backlog.length})`}</button>` : ''}`
      : `<p class="muted" style="margin:0">Ta to-do est vide. Le bouton + sert à y déposer une idée.</p>`}
    </section>
    ${vJournalCard(k)}
    <section class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:8px">
      <span class="eyebrow">Demain · ${esc(D.themes[wd(addDays(now, 1))].name)}</span>
      ${tf ? `<div class="between"><span style="font-family:var(--serif);font-size:18px">${esc(tf.text)}</span><button class="link" data-a="one-open" data-k="${tk}">Changer</button></div>
             <span class="muted" style="font-size:13px">Pense à poser l'alarme avec ce geste comme titre.</span>`
           : `<button class="btn-soft" data-a="one-open" data-k="${tk}">Choisir ma chose de demain</button>`}

function bookCover(b, w = 58, h = 80) {
  if (b.img && IMAGES[b.img]) return `<img src="${IMAGES[b.img]}" alt="" style="width:${w}px;height:${h}px;object-fit:cover;object-position:left top;border-radius:8px;flex-shrink:0">`;
  return `<span style="width:${w}px;height:${h}px;border-radius:8px;background:#303444;color:var(--plum);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;flex-shrink:0">${esc(b.title.charAt(0))}</span>`;
}

/* --- Semaine --- */
function vWeek() {
  const now = logicalNow(), tk = dkey(now), s = weekStart(now);
  const days = [...Array(7)].map((_, i) => addDays(s, i));
  const daily = active().filter(h => h.freq === 'days' && h.days.length === 7).map(h => h.name.toLowerCase());
  const wnum = isoWeek(now);
  return `<main class="screen">
    <header style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Semaine ${wnum} · ${days[0].getDate()} – ${days[6].getDate()} ${MONTHS[days[6].getMonth()]}</span><h1 class="h-title" style="font-size:34px">Ta semaine</h1></header>
    <div class="seg" role="tablist"><button role="tab" aria-selected="false" data-a="nav" data-v="today">Jour</button><button role="tab" aria-selected="true" class="on">Semaine</button></div>
    <div class="card strip">${days.map((d, i) => {
      const k = dkey(d), dp = dayProgress(k), isT = k === tk, fut = k > tk;
      return `<div class="d ${isT ? 'today' : ''}"><span>${WD[i]}</span>${ring(38, 15, 5, fut ? 0 : dp.pct, D.themes[i].color, '#22304B', `${WDN[i]} ${Math.round(dp.pct * 100)} %`)}<span>${d.getDate()}</span></div>`;
    }).join('')}</div>
    ${daily.length ? `<span class="muted" style="font-size:13px;margin-top:-8px">Chaque jour : ${esc(daily.join(' · '))}</span>` : ''}
    <div style="display:flex;flex-direction:column;gap:10px">${days.map((d, i) => {
      const k = dkey(d), th = D.themes[i], isT = k === tk, past = k < tk;
      const hs = active().filter(h => h.freq === 'days' && h.days.includes(i) && h.days.length < 7);
      const dp = dayProgress(k);
      return `<button class="card daycard ${isT ? 'today' : ''} ${past ? 'past' : ''}" data-a="theme" data-i="${i}">
        <span class="band" style="background:${th.color}"></span>
        <span class="body"><span class="between"><span class="t">${WDN[i]} · ${esc(th.name)}</span>
          <span style="font-size:12px;font-weight:700;color:${INK[th.color] || 'var(--teal)'}">${isT ? "Aujourd'hui" : past && dp.total ? Math.round(dp.pct * 100) + ' %' : ''}</span></span>
        <span class="chips" style="gap:6px">${hs.map(h => `<span class="tag ${!isT && !past ? '' : done(k, h) ? 'done' : ''}" style="background:${TINT[th.color] || '#1B2740'}">${esc(h.name)}</span>`).join('') || '<span class="muted" style="font-size:12px">Rien de prévu</span>'}</span>
        ${th.note ? `<span class="muted" style="font-size:12px">${esc(th.note)}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <p class="muted" style="font-size:13px;margin:0">Touche un jour pour renommer son thème. Les routines se règlent dans l'onglet Routines.</p>
  </main>`;
}
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }

/* --- Routines --- */
function vRoutines() {
  const now = logicalNow(), tk = dkey(now), s = weekStart(now);
  const days = [...Array(7)].map((_, i) => addDays(s, i));
  const f = S.routFilter;
  const list = active().filter(h => f === 'all' || (f === 'daily' && h.freq === 'days' && h.days.length === 7) || (f === 'some' && h.freq === 'days' && h.days.length < 7) || (f === 'weekly' && h.freq === 'weekly') || (f === 'monthly' && h.freq === 'monthly'));
  // stats
  let best = { n: 0, name: '' };
  active().forEach(h => { const n = streak(h); if (n > best.n) best = { n, name: h.name }; });
  let tot = 0, ok = 0;
  days.forEach(d => { const k = dkey(d); if (k > tk || (D.since && k < D.since)) return; active().filter(h => scheduledOn(h, d)).forEach(h => { tot++; if (done(k, h)) ok++; }); });
  let perfect = 0;
  for (let i = 1; i <= now.getDate(); i++) { const k = dkey(new Date(now.getFullYear(), now.getMonth(), i)); const dp = dayProgress(k); if (dp.total && dp.done === dp.total) perfect++; }
  const chip = (v, l) => `<button class="chip ${f === v ? 'on' : ''}" data-a="rfilter" data-v="${v}" aria-pressed="${f === v}">${l}</button>`;

  const rows = list.map(h => {
    const cells = days.map((d, i) => {
      const k = dkey(d);
      if (h.freq === 'days' && !h.days.includes(i)) return '<span class="dash"></span>';
      if (D.since && k < D.since) return '<span class="dot" style="background:#2F3441"></span>';
      if (k > tk) return '<span class="dot" style="background:#22304B"></span>';
      if (done(k, h)) return `<span class="dot" style="background:${h.color}"></span>`;
      if (k === tk) return `<span class="dot" style="border:2px solid ${h.color}"></span>`;
      return h.freq === 'days' ? '<span class="dot" style="border:2px solid #33415E"></span>' : '<span class="dash"></span>';
    }).join('');
    const st = streak(h);
    const todayItem = itemsFor(tk).includes(h);
    const right = todayItem ? (done(tk, h) ? `<svg width="40" height="40" viewBox="0 0 40 40" aria-label="Fait aujourd'hui" role="img"><circle cx="20" cy="20" r="17" fill="${h.color}"/><path d="M13 20l5 5 9-10" fill="none" stroke="#131D33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ring(40, 15, 5, prog(tk, h), h.color))
      : `<span class="muted" style="font-size:11px;text-align:right">${h.freq === 'monthly' ? periodCount(h, now) + '/' + (h.times || 1) : h.freq === 'weekly' ? periodCount(h, now) + '/' + (h.times || 1) : 'Repos'}</span>`;
    return `<button class="rrow" data-a="${h.type === 'measure' ? 'hlog' : 'hedit'}" data-id="${h.id}">
      <span class="between"><span class="who"><span class="ico" style="background:${TINT[h.color] || '#1B2740'}">${ic(h.icon, 20, 1.8, INK[h.color] || h.color)}</span>
      <span style="display:flex;flex-direction:column;min-width:0"><span class="nm">${esc(h.name)}</span><span class="mt">${esc(freqLabel(h))}${st > 1 ? ` · série ${st}` : ''}</span></span></span>
      <span style="display:flex;flex-shrink:0">${right}</span></span>
      <span class="rweek">${cells}</span></button>`;
  }).join('');

  // heatmap du mois
  const first = new Date(now.getFullYear(), now.getMonth(), 1), nd = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  let heat = '';
  for (let i = 0; i < wd(first); i++) heat += '<span></span>';
  for (let i = 1; i <= nd; i++) {
    const k = dkey(new Date(now.getFullYear(), now.getMonth(), i));
    if (k > tk) { heat += `<span style="border:1.5px dashed #2C3A57">${i}</span>`; continue; }
    if (D.since && k < D.since) { heat += `<span style="background:#2F3441">${i}</span>`; continue; }
    const p = dayProgress(k).pct;
    const bg = p >= 1 ? '#5FE0A6' : p >= .5 ? '#24313F' : p > 0 ? '#2B3442' : '#22304B';
    heat += `<span style="background:${bg};${p >= 1 ? 'color:#2F3644;font-weight:700' : ''}">${i}</span>`;
  }

  return `<main class="screen">
    <header class="between" style="align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${active().length} routines actives</span><h1 class="h-title" style="font-size:34px">Routines</h1></div>
      <div class="row" style="gap:8px"><button class="icon-btn" data-a="settings" aria-label="Réglages">${ic('gear', 22)}</button><button class="icon-btn" data-a="hnew" aria-label="Nouvelle routine">${ic('plus', 22, 2)}</button></div></header>
    <div class="stats">
      <div class="stat"><b>${best.n} j</b><span>${best.n ? 'Série ' + esc(best.name.toLowerCase()) : 'Meilleure série'}</span></div>
      <div class="stat"><b>${tot ? Math.round(ok / tot * 100) : 0} %</b><span>Cette semaine</span></div>
      <div class="stat"><b>${perfect}</b><span>Jours parfaits</span></div>
    </div>
    <div class="chips">${chip('all', 'Toutes')}${chip('daily', 'Quotidiennes')}${chip('some', 'Certains jours')}${chip('weekly', 'Hebdo')}${chip('monthly', 'Mensuelles')}</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="rweek rhead">${WD.map((w, i) => `<span style="${i === wd(now) ? 'color:var(--plum);font-weight:700' : ''}">${w}</span>`).join('')}</div>
      ${rows || '<p class="muted">Aucune routine dans ce filtre.</p>'}
    </div>
    <section class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div class="between"><span style="font-family:var(--serif);font-size:17px;font-weight:600">${MONTHS[now.getMonth()].replace(/^./, c => c.toUpperCase())}</span><span class="muted" style="font-size:12px">${perfect} jour${perfect > 1 ? 's' : ''} bouclé${perfect > 1 ? 's' : ''}</span></div>
      <div class="heat">${WD.map(w => `<span style="aspect-ratio:auto">${w}</span>`).join('')}${heat}</div>
    </section>
  </main>`;
}

/* --- Focus (minuteur) --- */
function timerElapsedMin() { const t = D.timer; return t && t.start ? (Date.now() - t.start) / 60000 : 0; }
function vFocus() {
  const t = D.timer; const h = hById(t.hid); const k = t.date;
  const cur = val(k, h) + timerElapsedMin();
  const rem = Math.max(0, h.target - cur);
  const mm = Math.floor(rem), ss = Math.floor((rem - mm) * 60);
  const running = !!t.start;
  const dots = [...Array(7)].map((_, i) => { const kk = dkey(addDays(fromKey(k), i - 6)); return `<span style="width:14px;height:14px;border-radius:50%;${done(kk, h) ? 'background:#4FD1B5' : 'border:2px solid #4FD1B5'}"></span>`; }).join('');
  return `<main class="focus">
    <div class="between" style="width:100%"><button class="icon-btn" style="background:#313643;color:var(--ink)" data-a="focus-close" aria-label="Retour">${ic('back', 22, 2)}</button>
      <span class="eyebrow" style="color:#A9B9C8">${esc(D.themes[wd(fromKey(k))].name)} · routine</span><span style="width:44px"></span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><h1 style="font-size:36px">${esc(h.name)}</h1>${h.cue ? `<span style="color:#A9B9C8">${esc(h.cue)}</span>` : ''}</div>
    <div class="ringbig"><svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true"><circle cx="140" cy="140" r="122" fill="#313643"/><circle cx="140" cy="140" r="122" fill="none" stroke="#2A3341" stroke-width="16"/><circle id="farc" cx="140" cy="140" r="122" fill="none" stroke="#4FD1B5" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="${(Math.min(1, cur / h.target) * 100).toFixed(2)} 100" transform="rotate(-90 140 140)"/></svg>
      <div class="lbl"><span class="clock" id="fclock">${rem <= 0 ? 'Fini' : `${pad(mm)}:${pad(ss)}`}</span><span style="color:#A9B9C8;font-size:14px" id="fsub">${rem <= 0 ? 'Objectif atteint' : 'restantes'} · ${Math.floor(cur)} / ${h.target} min</span></div></div>
    <div class="row" style="gap:14px"><button class="round" data-a="focus-adj" data-n="-5" aria-label="Moins 5 minutes">−5</button>
      <button class="primary" data-a="focus-toggle">${ic(running ? 'pause' : 'play', 20, 2.4)}${running ? 'Pause' : cur > 0 ? 'Reprendre' : 'Démarrer'}</button>
      <button class="round" data-a="focus-adj" data-n="5" aria-label="Plus 5 minutes">+5</button></div>
    <button class="link" style="text-decoration:underline;text-underline-offset:4px;font-size:15px" data-a="focus-finish">Terminer et valider</button>
    <div class="streak between"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#A9B9C8">Série en cours</span><span style="font-family:var(--serif);font-size:22px;font-weight:600">${streak(h)} jour${streak(h) > 1 ? 's' : ''}</span></div><div class="row" style="gap:6px" aria-label="7 derniers jours">${dots}</div></div>
  </main>`;
}
function tickFocus() {
  if (S.view !== 'focus' || !D.timer || !D.timer.start) return;
  const h = hById(D.timer.hid), cur = val(D.timer.date, h) + timerElapsedMin(), rem = Math.max(0, h.target - cur);
  const c = document.getElementById('fclock'), s = document.getElementById('fsub'), a = document.getElementById('farc');
  if (!c) return;
  if (rem <= 0) { stopTimer(); toast('Objectif atteint. Bien joué.'); render(); return; }
  const mm = Math.floor(rem), ss = Math.floor((rem - mm) * 60);
  c.textContent = `${pad(mm)}:${pad(ss)}`; s.textContent = `restantes · ${Math.floor(cur)} / ${h.target} min`;
  a.setAttribute('stroke-dasharray', `${(Math.min(1, cur / h.target) * 100).toFixed(2)} 100`);
}
function stopTimer() {
  const t = D.timer; if (!t || !t.start) return;
  const h = hById(t.hid); setVal(t.date, h, Math.min(h.target, val(t.date, h) + timerElapsedMin())); t.start = null; save();
}

    ${cur ? `<button class="btn-danger" data-a="one-clear">Retirer et remettre dans la to-do</button>` : ''}`;

function shHlog() {

const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
function timeLabel() {
  const p = S.medit.p;
  if (SND.playing) return SND.endAt ? mmss(SND.endAt - Date.now()) : mmss(Date.now() - SND.startedAt);
  return p.minutes ? `${p.minutes} min` : 'Sans fin';
}
function sndFrame() {
  if (!SND.N) return;
  const t = SND.ctx.currentTime, p = S.medit.p;
  SND.phase += Math.max(0, t - SND.lastT) / p.period; SND.lastT = Math.max(t, SND.lastT);
  const orb = document.getElementById('orb');
  if (orb && SND.playing) orb.style.transform = `scale(${(1 + (.03 + p.depth * .09) * Math.sin(2 * Math.PI * SND.phase)).toFixed(4)})`;
  const tm = document.getElementById('amb-time'); if (tm) tm.textContent = timeLabel();
  SND.raf = requestAnimationFrame(sndFrame);
}

function ambInput(el) {

const rnd = (a, b) => a + Math.random() * (b - a);
const AMB_ACTIONS = {
  'amb-play': () => { if (SND.playing) sndStop(false); else { sndStart(); render(); } },
  'amb-mode': el => { S.medit.mode = el.dataset.v; render(); },
  'amb-set': el => {
    const k = el.dataset.p; let v = el.dataset.v;
    if (k === 'minutes') { v = Number(v); if (SND.playing) SND.endAt = v ? SND.startedAt + v * 60000 : 0; } else S.medit.dirty = true;
    S.medit.p[k] = v; sndApply(S.medit.p); render();
  },
  'amb-tog': el => { const k = el.dataset.p; S.medit.p[k] = !S.medit.p[k]; S.medit.dirty = true; sndApply(S.medit.p, .15); render(); },
  'amb-shuffle': () => {
    const p = S.medit.p;
    Object.assign(p, {
      freq: 90 * Math.pow(4, Math.random()), wave: Math.random() < .7 ? 'sine' : 'triangle', toneVol: rnd(.3, .6),
      beatOn: Math.random() < .65, beat: Math.round(rnd(3, 14) * 2) / 2,
      oct: Math.random() < .5 ? rnd(0, .3) : 0, fifth: Math.random() < .5 ? rnd(0, .3) : 0,
      noiseOn: Math.random() < .85, noise: ['pink', 'pink', 'brown', 'brown', 'white'][Math.floor(Math.random() * 5)],
      noiseVol: rnd(.12, .45), cutoff: 400 * Math.pow(6, Math.random()), depth: rnd(.15, .75), period: Math.round(rnd(7, 16) * 2) / 2, space: rnd(.2, .65),
    });
    if (p.noise === 'white') p.noiseVol = rnd(.04, .12);
    S.medit.cur = null; S.medit.label = 'Ambiance surprise'; S.medit.dirty = false;
    sndApply(p, .8); render();
  },
  'amb-load': el => {
    const a = D.ambiances.find(x => x.id === el.dataset.id); if (!a) return;
    S.medit.cur = a.id; S.medit.p = { ...AMB_DEF, ...a.p }; S.medit.dirty = false;
    if (SND.playing) { sndApply(S.medit.p, .7); a.plays = (a.plays || 0) + 1; save(); SND.endAt = a.p.minutes ? SND.startedAt + a.p.minutes * 60000 : 0; }
    render();
  },
  'amb-save': () => { const a = D.ambiances.find(x => x.id === S.medit.cur); openSheet({ type: 'amb', color: a ? a.color : COLORS[0], name: '' }); },
  'amb-update': () => {
    const a = D.ambiances.find(x => x.id === S.medit.cur); if (!a) return;
    a.p = { ...S.medit.p }; S.medit.dirty = false; save(); closeSheet(); render(); toast(`« ${a.name} » mise à jour`);
  },
  'amb-create': () => {
    const n = (input('ambname') || '').trim(); if (!n) { toast('Donne-lui un nom'); return; }
    const a = { id: 'a_' + uid(), name: n, color: S.sheet.color, plays: 0, p: { ...S.medit.p } };
    D.ambiances.push(a); S.medit.cur = a.id; S.medit.dirty = false; save(); closeSheet(); render(); toast('Ambiance enregistrée');
  },
  'amb-col': el => { S.sheet.name = input('ambname'); S.sheet.color = el.dataset.v; renderSheet(); },
  'amb-edit': el => { const a = D.ambiances.find(x => x.id === el.dataset.id); if (a) openSheet({ type: 'ambedit', id: a.id, color: a.color, name: a.name }); },
  'amb-rename': () => {
    const a = D.ambiances.find(x => x.id === S.sheet.id); if (!a) return;
    a.name = (input('ambname') || '').trim() || a.name; a.color = S.sheet.color; save(); closeSheet(); render();
  },
  'amb-dup': () => {
    const a = D.ambiances.find(x => x.id === S.sheet.id); if (!a) return;
    const b = { ...JSON.parse(JSON.stringify(a)), id: 'a_' + uid(), name: a.name + ' (copie)', plays: 0 };
    D.ambiances.splice(D.ambiances.indexOf(a) + 1, 0, b); save(); closeSheet(); render(); toast('Copie créée');
  },
  'amb-del': () => {
    if (!S.sheet.confirm) { S.sheet.name = input('ambname'); S.sheet.confirm = true; renderSheet(); return; }
    D.ambiances = D.ambiances.filter(x => x.id !== S.sheet.id);
    if (S.medit.cur === S.sheet.id) { S.medit.cur = null; S.medit.label = 'Ambiance libre'; }

  },

/* --- Routines « mesure » (ex. pesée) avec historique --- */
const fmtNum = v => String(Math.round(v * 10) / 10).replace('.', ',');
function mHist(h) { const m = (D.measures[h.id] || {}); return Object.keys(m).sort().map(k => ({ k, v: m[k] })); }
function mLast(h) { const a = mHist(h); return a.length ? a[a.length - 1] : null; }
const MSHORT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
function shortDate(k) { const d = fromKey(k); return `${d.getDate()} ${MSHORT[d.getMonth()]}`; }
function mChart(h) {
  const all = mHist(h), r = S.sheet.range || 90;
  const from = dkey(addDays(logicalNow(), -r));
  const a = r === 'all' ? all : all.filter(x => x.k >= from);
  if (a.length < 2) return `<p class="muted" style="margin:0;font-size:13px">La courbe apparaîtra dès la deuxième mesure.</p>`;
  const W = 320, H = 150, pl = 34, pr = 10, pt = 12, pb = 22;
  const t0 = fromKey(a[0].k).getTime(), t1 = fromKey(a[a.length - 1].k).getTime() || t0 + 1;
  let lo = Math.min(...a.map(x => x.v)), hi = Math.max(...a.map(x => x.v)); if (hi - lo < 1) { lo -= .5; hi += .5; }
  const X = k => pl + (fromKey(k).getTime() - t0) / Math.max(1, t1 - t0) * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const pts = a.map(x => `${X(x.k).toFixed(1)},${Y(x.v).toFixed(1)}`).join(' ');
  const area = `${pl},${H - pb} ${pts} ${X(a[a.length - 1].k).toFixed(1)},${H - pb}`;
  const col = h.color, ink = INK[col] || col;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution de ${esc(h.name)}">
    <line x1="${pl}" x2="${W - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="#22304B"/><line x1="${pl}" x2="${W - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="#22304B"/>
    <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="10" fill="#9AAEC0">${fmtNum(hi)}</text>
    <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="10" fill="#9AAEC0">${fmtNum(lo)}</text>
    <polygon points="${area}" fill="${TINT[col] || '#1B2740'}" opacity=".8"/>
    <polyline points="${pts}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${a.map(x => `<circle cx="${X(x.k).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="3" fill="${ink}"/>`).join('')}
    <text x="${pl}" y="${H - 6}" font-size="10" fill="#9AAEC0">${shortDate(a[0].k)}</text>
    <text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="10" fill="#9AAEC0">${shortDate(a[a.length - 1].k)}</text>
  </svg>`;
}
function measureBlock(h) {
  const k = todayKey(), cur = (D.measures[h.id] || {})[k], unit = h.unit || '';
  const all = mHist(h), last = mLast(h), first = all[0];

  return `<div class="row"><input class="input" id="msval" type="text" inputmode="decimal" placeholder="${prev ? fmtNum(prev.v) : '0,0'}" value="${cur !== undefined ? fmtNum(cur) : ''}" aria-label="Valeur du jour" style="font-size:24px;font-family:var(--serif)">

    ${last ? `<div class="mstats"><div><b>${fmtNum(last.v)}</b><span>${esc(unit)} · dernière</span></div>
      ${prev && last.k === k ? `<div><b>${last.v - prev.v > 0 ? '+' : ''}${fmtNum(last.v - prev.v)}</b><span>depuis le ${shortDate(prev.k)}</span></div>` : ''}

      ${all.length > 8 && !S.sheet.allHist ? `<button class="link" data-a="ms-all" style="align-self:flex-start">Tout l'historique (${all.length})</button>` : ''}` : ''}`;

function mdLite(text) {

  const flush = () => { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } if (call) { out.push(`<div class="callout"><b>${call.title}</b>${call.body.map(l => `<p>${l}</p>`).join('')}</div>`); call = null; } };
  for (const l of t.split('\n')) {
    const c = l.match(/^> \[!\w+\][-+]? ?(.*)$/);

    if (call && /^>/.test(l)) { const x = l.replace(/^> ?/, ''); if (x.trim()) call.body.push(inline(x)); continue; }

    const h = l.match(/^#{2,6} (.*)$/);
    if (h) out.push(`<h3>${inline(h[1])}</h3>`);

}

/* Écrit un fichier de La Serre hors de 05 Bifröst (graine, avis), en se remettant à jour d'abord */
async function writeSerre(path, makeText, headline) {
  for (let i = 0; i < 3; i++) {
    await syncPull();
    const cur = makeText.length ? await noteText(path, true).catch(() => null) : null;
    const text = makeText(cur);
    try { SY.head = await commitFiles({ [path]: text }, [], headline); saveSyncState(); TEXTS[path] = text; return text; }
    catch (e) { if (!(e && e.gh)) throw e; }

}
async function toggleAvis(p, label) {

function mdFull(text) {
  let t = String(text || '').replace(/\r/g, '').replace(/^---\n[\s\S]*?\n---\n?/, '').replace(/^# .*\n?/m, '');
  const img = f => { const u = cover(f); return u ? `<img src="${u}" alt="">` : `<span class="imgwait"></span>`; };
  const inline = s => esc(s)
    .replace(/!\[\[([^\]|]+?\.(?:webp|png|jpe?g|gif))(?:\|[^\]]*)?\]\]/gi, (m, f) => img(f.split('/').pop()))
    .replace(/!\[\[[^\]]*\]\]/g, '')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (m, a, b) => `<button class="wl" data-a="read-link" data-n="${a}">${b}</button>`)
    .replace(/\[\[([^\]]+)\]\]/g, (m, a) => `<button class="wl" data-a="read-link" data-n="${a}">${a.split('#')[0]}</button>`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null, call = null, table = null, code = null;
  const flush = () => {
    if (list) { out.push(`<${list.t}>${list.items.join('')}</${list.t}>`); list = null; }
    if (table) { out.push(`<div class="tbl"><table>${table.map((r, i) => `<tr>${r.map(c => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('')}</tr>`).join('')}</table></div>`); table = null; }
    if (call) { const inner = `${call.body.join('')}`; out.push(call.fold ? `<details class="callout"><summary>${call.title || 'Détails'}</summary>${inner}</details>` : `<div class="callout">${call.title ? `<b>${call.title}</b>` : ''}${inner}</div>`); call = null; }
  };
  for (const l of t.split('\n')) {
    if (code) { if (/^```/.test(l)) { out.push(`<pre>${esc(code.join('\n'))}</pre>`); code = null; } else code.push(l); continue; }
    if (/^```/.test(l)) { flush(); code = []; continue; }
    const c = l.match(/^> \[!\w+\]([-+]?) ?(.*)$/);
    if (c) { flush(); call = { title: inline(c[2]), fold: c[1] === '-', body: [] }; continue; }
    if (call && /^>/.test(l)) { const x = l.replace(/^> ?/, ''); if (/^```/.test(x)) continue; if (x.trim()) call.body.push(/^\s*[-*] /.test(x) ? `<p>• ${inline(x.replace(/^\s*[-*] (\[.\] )?/, ''))}</p>` : `<p>${inline(x)}</p>`); continue; }
    if (/^\s*\|/.test(l)) { if (call || list) flush(); const cells = l.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(x => x.trim().replace(/\\\|/g, '|')); if (cells.every(x => /^:?-{2,}:?$/.test(x))) continue; (table = table || []).push(cells); continue; }
    const li = l.match(/^\s*(?:([-*])|(\d+)\.) (?:\[(.)\] )?(.*)$/);
    if (li) { if (call || table) flush(); const t2 = li[2] ? 'ol' : 'ul'; if (list && list.t !== t2) flush(); list = list || { t: t2, items: [] }; list.items.push(`<li>${li[3] && li[3] !== ' ' ? '☑︎ ' : li[3] === ' ' ? '☐ ' : ''}${inline(li[4])}</li>`); continue; }
    flush();
    const h = l.match(/^(#{2,6}) (.*)$/);
    if (h) out.push(`<h${Math.min(4, h[1].length + 1)}>${inline(h[2])}</h${Math.min(4, h[1].length + 1)}>`);
    else if (/^---+$/.test(l.trim())) out.push('<hr>');
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }

  return out.join('');
}

/* --- Ta semaine en bref --- */
function dSemaine() {
  const now = logicalNow(), ws = weekStart(now), keys = [];
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d <= now) keys.push(dkey(d)); }
  const sunday = wd(now) === 6;
  const perfect = keys.filter(k => { const p = dayProgress(k); return p.total && p.done >= p.total; }).length;
  const ticks = keys.reduce((a, k) => a + dayProgress(k).done, 0), due = keys.reduce((a, k) => a + dayProgress(k).total, 0);
  const ses = (D.sessions || []).filter(s => keys.includes(s.k));
  const pas = keys.filter(k => (D.pas || {})[k] && D.pas[k].graine).length;
  const done = (D.doneTodos || []).filter(d => keys.includes(d.doneAt)).length;
  const seeds = (KIO.notes || []).filter(n => n.p.startsWith('00 Graines/') && keys.includes(String(n.créé))).length;
  const best = D.habits.filter(h => !h.archived).map(h => [h, keys.filter(k => ((D.logs[k] || {})[h.id] || 0) >= (h.type === 'check' || h.type === 'measure' ? 1 : h.target)).length]).sort((a, b) => b[1] - a[1])[0];
  const st = (v, l) => `<div><b>${v}</b><span>${l}</span></div>`;
  return block('dw' + (sunday ? ' sunday' : ''), sunday ? '🗓️ Le tour du dimanche' : '🗓️ Ta semaine en bref', `
    <div class="stats three">${st(due ? Math.round(ticks / due * 100) + ' %' : '–', 'routines tenues')}${st(perfect, `jour${perfect > 1 ? 's' : ''} parfait${perfect > 1 ? 's' : ''}`)}${st(ses.length, `séance${ses.length > 1 ? 's' : ''}${ses.length ? ' · ' + ses.reduce((a, s) => a + (s.dur || 0), 0) + ' min' : ''}`)}${st(pas, `pas du jour`)}${st(seeds, `graine${seeds > 1 ? 's' : ''} semée${seeds > 1 ? 's' : ''}`)}${st(done, `tâche${done > 1 ? 's' : ''} faite${done > 1 ? 's' : ''}`)}</div>
    ${best && best[1] ? `<span class="muted" style="font-size:13px">La plus tenue : <b style="color:var(--ink)">${esc(best[0].name)}</b> (${best[1]}/${keys.length} j)</span>` : ''}`);
}
