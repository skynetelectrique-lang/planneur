    D.goals.push(g); save(); S.sheet.id = g.id; render(); renderSheet();
    setTimeout(() => { const x = document.getElementById('gstep'); if (x) x.focus(); }, 80);
  },
  'goal-save': () => { gCapture(); const g = gFind(S.sheet.id), d = S.sheet.draft; g.title = d.title.trim() || g.title; g.why = d.why.trim(); g.horizon = d.horizon; g.color = d.color; save(); closeSheet(); render(); },
  'goal-sadd': () => {
    const t = (input('gstep') || '').trim(); if (!t) return; gCapture();
    gFind(S.sheet.id).steps.push({ id: 's' + uid(), text: t, done: false }); save(); render(); renderSheet();
    const x = document.getElementById('gstep'); if (x) x.focus();
  },
  'goal-step': el => {
    const g = gFind(el.dataset.g), s = g.steps.find(x => x.id === el.dataset.id); if (!s) return;
    if (S.sheet && S.sheet.type === 'goal') gCapture();
    s.done = !s.done; save(); render(); if (S.sheet && S.sheet.type === 'goal') renderSheet();
    if (s.done && g.steps.every(x => x.done)) toast(`Toutes les étapes de « ${g.title} » sont faites`);
  },
  'goal-sdel': el => { gCapture(); const g = gFind(el.dataset.g); g.steps = g.steps.filter(x => x.id !== el.dataset.id); save(); render(); renderSheet(); },
  'goal-task': el => {
    const g = gFind(el.dataset.g), s = g.steps.find(x => x.id === el.dataset.id);
    D.backlog.unshift({ id: uid(), text: s.text, q: 2 }); save(); toast('Ajoutée à ta to-do, dans Planifier');
  },
  'goal-done': () => { gCapture(); const g = gFind(S.sheet.id); g.done = !g.done; g.doneAt = g.done ? Date.now() : null; save(); closeSheet(); render(); if (g.done) toast('Objectif atteint. Bravo.'); },
  'goal-del': () => { if (!S.sheet.confirm) { gCapture(); S.sheet.confirm = true; renderSheet(); return; } D.goals = D.goals.filter(x => x.id !== S.sheet.id); save(); closeSheet(); render(); },
  'goal-showdone': () => { S.gShowDone = !S.gShowDone; render(); },
};

/* ============ TCC (programme de Safren, adapté) ============ */
function tccDef() {
  return {
    session: 0,
    hw: null,
    log: [{ id: 'l' + uid(), date: '2026-11-22', n: 0, seen: 'État des lieux, choix de la TCC de Safren, création du carnet', hw: 'Faire la séance 0', res: '' }],
    loop: ['Permis', 'Travail', 'Addictions'].map(x => ({ id: 'x' + uid(), ex: x, diff: '', fail: '', thought: '', avoid: '' })),
    asrs: [],
    rules: { rythme: '', decroche: '', medecin: '', femme: '' },
  };
}
const TPLAN = [
  { n: '0', t: 'Fondations', d: 'Ma boucle, ASRS, nos règles', from: 0, to: 0 },
  { n: '1', t: "S'organiser et planifier", d: 'Un seul système, revue quotidienne, priorités, découper, rendre le temps visible', from: 1, to: 4 },
  { n: '2', t: 'Gérer la distraction', d: 'Durée de concentration, blocs de travail, reporter les distractions', from: 5, to: 7 },
  { n: '3', t: 'Penser autrement', d: 'Pensées automatiques, erreurs de pensée, autorité et travail', from: 8, to: 10 },
  { n: '+', t: 'Procrastination', d: 'Appliquer les outils aux tâches repoussées', from: 11, to: 11 },
  { n: '✓', t: 'Bilan', d: 'ASRS de fin, tenir dans la durée', from: 12, to: 12 },
];
const tPhase = n => TPLAN.find(p => n >= p.from && n <= p.to) || TPLAN[TPLAN.length - 1];
const TSTAGES = [
  ['diff', 'Difficulté TDAH en jeu', '#3CCFC0', 'Difficulté', 'Ex. oublier, repousser, ne pas savoir par où commencer'],
  ['fail', 'Ce qui a raté', '#D9A766', 'Raté', "Ce qui s'est concrètement passé"],
  ['thought', 'La pensée qui a suivi', '#D46FB0', 'Pensée', '« Je suis nul », « Ça sert à rien »…'],
  ['avoid', "Ce que j'ai évité ensuite", '#B865A6', 'Évitement', 'Ce que tu as fui ou laissé tomber'],
];
const TRULES = [
  ['rythme', 'Rythme des séances', 'Ex. le dimanche à 14 h'],
  ['decroche', 'Si je décroche', "Ce qu'on fait quand je reviens"],
  ['medecin', "Quand j'appelle un médecin", 'Les signaux qui doivent me faire consulter'],
  ['femme', 'Ma femme dans le programme', "Est-ce que je l'implique, et quand"],
];
/* ASRS v1.1 (OMS) : 18 questions, 0 à 4. Seuils de la zone grisée : 2 = Parfois, 3 = Souvent. */
const ASRS_L = ['Jamais', 'Rarement', 'Parfois', 'Souvent', 'Très souvent'];
const ASRS_TH = [2, 2, 2, 3, 3, 3, 3, 3, 2, 3, 3, 2, 3, 3, 3, 2, 3, 2];
const ASRS_Q = [
  "Une fois le plus difficile d'un projet fait, à quelle fréquence as-tu du mal à en finaliser les derniers détails ?",
  "Quand une tâche demande de l'organisation, à quelle fréquence as-tu du mal à mettre les choses en ordre ?",
  'À quelle fréquence as-tu du mal à te souvenir de tes rendez-vous ou de tes obligations ?',
  "Quand une tâche demande beaucoup de réflexion, à quelle fréquence évites-tu de t'y mettre ou repousses-tu le moment de commencer ?",
  'À quelle fréquence remues-tu les mains ou les pieds, ou te tortilles-tu, quand tu dois rester assis longtemps ?',
  'À quelle fréquence te sens-tu excessivement actif et poussé à faire des choses, comme mené par un moteur ?',
  "À quelle fréquence fais-tu des erreurs d'inattention quand tu travailles sur un projet ennuyeux ou difficile ?",
  'À quelle fréquence as-tu du mal à rester attentif pendant un travail ennuyeux ou répétitif ?',
  "À quelle fréquence as-tu du mal à te concentrer sur ce qu'on te dit, même quand on s'adresse directement à toi ?",
  'À quelle fréquence égares-tu des choses ou as-tu du mal à les retrouver, chez toi ou au travail ?',
  "À quelle fréquence es-tu distrait par l'activité ou le bruit autour de toi ?",
  "À quelle fréquence te lèves-tu en réunion, ou dans d'autres situations où l'on attend que tu restes assis ?",
  'À quelle fréquence te sens-tu agité, incapable de tenir en place ?',
  'À quelle fréquence as-tu du mal à décompresser et à te détendre quand tu as du temps pour toi ?',
  'À quelle fréquence te surprends-tu à trop parler en société ?',
  "En conversation, à quelle fréquence termines-tu les phrases des autres avant qu'ils aient pu le faire eux-mêmes ?",
  "À quelle fréquence as-tu du mal à attendre ton tour quand c'est nécessaire ?",
  'À quelle fréquence interromps-tu les autres quand ils sont occupés ?',
];
function asrsScore(ans) {
  return { a: ans.slice(0, 6).filter((v, i) => v >= ASRS_TH[i]).length, total: ans.reduce((x, v) => x + v, 0) };
}
const tLongDate = k => { const d = fromKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

function tTabs() {
  const t = S.ttab || 'week', b = (v, l) => `<button role="tab" class="${t === v ? 'on' : ''}" aria-selected="${t === v}" data-a="ttab" data-v="${v}">${l}</button>`;

}
function vTcc() {
  const T = D.tcc, t = S.ttab || 'week', ph = tPhase(T.session);

}
function tHwCard() {

  const s = fromKey(T.hw.since), days = Array.from({ length: 7 }, (_, i) => addDays(s, i));
  const n = days.filter(d => T.hw.days[dkey(d)]).length, over = k > dkey(days[6]);

    const dk = dkey(d), on = !!T.hw.days[dk], fut = dk > k;

    <button class="pill-btn" data-a="tcc-hw">${ic('pen', 16, 2)}Modifier</button></div>
  </section>`;
}
function tWeekBody() {
  const T = D.tcc;
  const plan = TPLAN.map(p => {
    const st = T.session > p.to ? 'done' : T.session >= p.from ? 'cur' : 'fut';
    const range = p.from === p.to ? `Séance ${p.from}` : `Séances ${p.from} à ${p.to}`;
    return `<div class="tp ${st}"><span class="mk">${st === 'done' ? ic('check', 14, 2.6) : p.n}</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="tt">${esc(p.t)}</span><span class="td">${range} · ${esc(p.d)}</span></div></div>`;
  }).join('');
  const logs = T.log.slice().sort((a, b) => b.date.localeCompare(a.date) || b.n - a.n);
  const entries = logs.map(e => {

  }).join('');
  const rules = TRULES.map(([f, l]) => `<span class="jl"><b>${l}</b>${(T.rules[f] || '').trim() ? esc(T.rules[f]) : '<span class="muted">À définir en séance 0</span>'}</span>`).join('');
  return `${tHwCard()}
    <section style="display:flex;flex-direction:column;gap:10px"><h2 class="h-sec">Le programme</h2>
      <div class="list tplan">${plan}
        <div class="between" style="padding:8px 12px 8px 16px"><span class="muted" style="font-size:13px">Je suis à la séance</span>
        <div class="stepper"><button data-a="tcc-sess" data-n="-1" aria-label="Séance précédente">−</button><b>${T.session}</b><button data-a="tcc-sess" data-n="1" aria-label="Séance suivante">+</button></div></div>
      </div></section>
    <section style="display:flex;flex-direction:column;gap:10px"><div class="between"><h2 class="h-sec">Journal des séances</h2><button class="link" data-a="tcc-log">+ Noter une séance</button></div>
      ${entries || '<p class="muted" style="margin:0">Rien encore.</p>'}</section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2 class="h-sec">Nos règles</h2>
      <button class="card jentry" data-a="tcc-rules">${rules}</button></section>`;
}
function tLoopBody() {
  const flow = TSTAGES.map(([, , c, s]) => `<span style="--t:${TINT[c]};--k:${INK[c]}">${s}</span>`).join('<i>→</i>');
  const cards = D.tcc.loop.map(b => `<button class="card tloop" data-a="tcc-loop" data-id="${b.id}"><span class="tlt">${esc(b.ex)}</span><span class="tchain">${TSTAGES.map(([f, l, c]) => `<span class="tstage" style="--c:${c}"><b>${l}</b>${(b[f] || '').trim() ? `<span>${esc(b[f])}</span>` : '<span class="empty">À remplir</span>'}</span>`).join('')}</span></button>`).join('');
  return `<section class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:12px">
      <p style="margin:0;font-size:14px;line-height:1.45">Une difficulté liée au TDAH mène à un raté, le raté à une pensée négative, la pensée à l'évitement. Et l'évitement renforce la difficulté. Pour chaque exemple réel, remonte la chaîne.</p>

function tAsrsBody() {

function vAsrs() {

const TCC_ACTIONS = {
  ttab: el => { S.ttab = el.dataset.v; S.asrsDel = null; render(); },
  'tcc-day': el => { const h = D.tcc.hw, k = el.dataset.k; if (!h) return; if (h.days[k]) delete h.days[k]; else h.days[k] = true; save(); render(); },

  'tcc-hw-del': () => { D.tcc.hw = null; save(); closeSheet(); render(); },
  'tcc-sess': el => { const T = D.tcc; T.session = Math.max(0, Math.min(12, T.session + Number(el.dataset.n))); save(); render(); },
  'tcc-log': el => {
    const e = el.dataset.id ? D.tcc.log.find(x => x.id === el.dataset.id) : null;

  },
  'tlog-n': el => { tlCap(); const d = S.sheet.draft; d.n = Math.max(0, Math.min(12, d.n + Number(el.dataset.n))); renderSheet(); },
  'tlog-sethw': () => { tlCap(); S.sheet.draft.setHw = !S.sheet.draft.setHw; renderSheet(); },
  'tlog-save': () => {

    if (d.setHw && rec.hw && !(T.hw && T.hw.text === rec.hw)) T.hw = { text: rec.hw, since: todayKey(), days: {} };
    save(); closeSheet(); render(); toast('Séance enregistrée');
  },
  'tlog-del': () => { if (!S.sheet.confirm) { tlCap(); S.sheet.confirm = true; renderSheet(); return; } D.tcc.log = D.tcc.log.filter(x => x.id !== S.sheet.id); save(); closeSheet(); render(); },
  'tcc-rules': () => openSheet({ type: 'tccrules' }),
  'trules-save': () => { TRULES.forEach(([f]) => { D.tcc.rules[f] = (input('tr_' + f) || '').trim(); }); save(); closeSheet(); render(); toast('Règles enregistrées'); },
  'tcc-loop': el => {
    const b = el.dataset.id ? D.tcc.loop.find(x => x.id === el.dataset.id) : null;
    openSheet({ type: 'tccloop', id: b ? b.id : null, draft: b ? { ...b } : { ex: '', diff: '', fail: '', thought: '', avoid: '' } });
  },
  'tloop-save': () => {
    tbCap(); const G = S.sheet, d = G.draft; if (!d.ex.trim()) { toast("Donne un nom à l'exemple"); return; }
    const rec = { ex: d.ex.trim() }; TSTAGES.forEach(([f]) => { rec[f] = (d[f] || '').trim(); });
    if (G.id) Object.assign(D.tcc.loop.find(x => x.id === G.id), rec); else D.tcc.loop.push({ id: 'x' + uid(), ...rec });
    save(); closeSheet(); render();
  },
  'tloop-del': () => { if (!S.sheet.confirm) { tbCap(); S.sheet.confirm = true; renderSheet(); return; } D.tcc.loop = D.tcc.loop.filter(x => x.id !== S.sheet.id); save(); closeSheet(); render(); },
  'asrs-start': () => { S.asrs = { i: 0, ans: [] }; S.view = 'asrs'; render(); },
  'asrs-ans': el => {
    const Q = S.asrs; if (!Q || Q.busy) return; Q.ans[Q.i] = Number(el.dataset.v); Q.busy = true; render();
    setTimeout(() => {
      Q.busy = false;
      if (Q.i < ASRS_Q.length - 1) { Q.i++; render(); return; }
      const sc = asrsScore(Q.ans);
      D.tcc.asrs.push({ id: 'q' + uid(), at: Date.now(), date: todayKey(), ans: Q.ans.slice(), a: sc.a, total: sc.total });
      save(); S.asrs = null; S.view = 'tcc'; S.ttab = 'asrs'; render(); toast('Questionnaire enregistré');
    }, 220);
  },
  'asrs-back': () => { const Q = S.asrs; if (Q && Q.i > 0) { Q.i--; render(); } else A['asrs-quit'](); },
  'asrs-quit': () => { S.asrs = null; S.view = 'tcc'; render(); },
  'asrs-del': el => {
    if (S.asrsDel !== el.dataset.id) { S.asrsDel = el.dataset.id; render(); return; }
    D.tcc.asrs = D.tcc.asrs.filter(x => x.id !== el.dataset.id); S.asrsDel = null; save(); render();
  },
};

const A = {
  nav: el => { S.view = el.dataset.v; render(); },
  fab: () => openSheet({ type: 'add' }),
  scrim: (el, ev) => { if (ev.target === el) closeSheet(); },
  ring: el => {
    const h = hById(el.dataset.id), k = todayKey();
    if (h.type === 'measure') { A.hlog(el); return; }
    if (h.type === 'check') setVal(k, h, done(k, h) ? 0 : 1);
    else if (h.type === 'count') setVal(k, h, done(k, h) ? 0 : val(k, h) + 1);
    else { A['focus-open'](el); return; }
    save(); render(); checkCelebrate();
    const t = document.getElementById('t_' + h.id); if (t) t.querySelector('.ringbtn').classList.add('pop');
  },
  hlog: el => openSheet({ type: 'hlog', id: el.dataset.id }),
  'hl-step': el => { const h = hById(S.sheet.id), k = todayKey(); setVal(k, h, Math.max(0, val(k, h) + Number(el.dataset.n))); save(); render(); checkCelebrate(); },
  'hl-set': el => { const h = hById(S.sheet.id); setVal(todayKey(), h, Number(el.dataset.n)); save(); closeSheet(); render(); checkCelebrate(); },
  hnew: () => openSheet({ type: 'habit', isNew: true, draft: { id: 'h_' + uid(), name: '', icon: 'star', color: '#5FE0A6', type: 'check', target: 1, freq: 'days', days: [0, 1, 2, 3, 4, 5, 6], times: 1, cue: '', archived: false } }),
  hedit: el => openSheet({ type: 'habit', isNew: false, draft: JSON.parse(JSON.stringify(hById(el.dataset.id))) }),
  hd: el => {
    captureHabitDraft(); const d = S.sheet.draft, f = el.dataset.f, v = el.dataset.v; d[f] = v;
    if (f === 'type') d.target = v === 'check' || v === 'measure' ? 1 : v === 'time' ? (d.target > 1 ? d.target : 15) : (d.target > 1 ? d.target : 3);
    renderSheet();
  },
  'hd-day': el => { captureHabitDraft(); const d = S.sheet.draft, i = Number(el.dataset.i); d.days = d.days.includes(i) ? d.days.filter(x => x !== i) : [...d.days, i].sort(); renderSheet(); },
  'hd-days': el => { captureHabitDraft(); S.sheet.draft.days = el.dataset.v === 'all' ? [0, 1, 2, 3, 4, 5, 6] : []; renderSheet(); },
  hsave: () => {
    captureHabitDraft(); const d = S.sheet.draft;
    if (!d.name.trim()) { toast('Donne-lui un nom'); return; }
    if (d.type === 'check' || d.type === 'measure') d.target = 1;
    if (d.type === 'measure' && !d.unit) d.unit = 'kg';
    const i = D.habits.findIndex(h => h.id === d.id); if (i >= 0) D.habits[i] = d; else D.habits.push(d);
    save(); closeSheet(); render(); toast('Routine enregistrée');
  },
  harchive: () => { const h = hById(S.sheet.draft.id); h.archived = true; save(); closeSheet(); render(); toast('Routine en pause. Elle garde son historique.'); },
  hdelete: () => { if (!S.sheet.confirm) { captureHabitDraft(); S.sheet.confirm = true; renderSheet(); return; } D.habits = D.habits.filter(h => h.id !== S.sheet.draft.id); save(); closeSheet(); render(); },
  rfilter: el => { S.routFilter = el.dataset.v; render(); },
  theme: el => { const i = Number(el.dataset.i); openSheet({ type: 'theme', i, draft: { ...D.themes[i] } }); },
  td: el => { const d = S.sheet.draft; d.name = input('tname'); d.note = input('tnote'); d.color = el.dataset.v; renderSheet(); },
  tsave: () => { const d = S.sheet.draft; d.name = input('tname').trim() || d.name; d.note = input('tnote').trim(); D.themes[S.sheet.i] = d; save(); closeSheet(); render(); },
  'one-open': el => openSheet({ type: 'one', k: el.dataset.k }),
  'one-save': () => { const t = input('onetxt').trim(); if (!t) return; D.focus[S.sheet.k] = { text: t, done: false }; save(); closeSheet(); render(); },
  'one-pick': el => { const b = D.backlog.find(x => x.id === el.dataset.id); D.focus[S.sheet.k] = { text: b.text, done: false }; D.backlog = D.backlog.filter(x => x !== b); save(); closeSheet(); render(); },
  'one-clear': () => { const f = D.focus[S.sheet.k]; D.backlog.unshift({ id: uid(), text: f.text }); delete D.focus[S.sheet.k]; save(); closeSheet(); render(); },
  'one-done': () => { const f = D.focus[todayKey()]; f.done = !f.done; save(); render(); if (f.done) toast('Fait. Tout le reste est du bonus.'); },
  'bl-tomorrow': el => {
    const tk = dkey(addDays(logicalNow(), 1)), b = D.backlog.find(x => x.id === el.dataset.id);
    if (D.focus[tk]) D.backlog.push({ id: uid(), text: D.focus[tk].text });
    D.focus[tk] = { text: b.text, done: false }; D.backlog = D.backlog.filter(x => x !== b); save(); render(); toast('Prévu pour demain');
  },
  'bl-del': el => { D.backlog = D.backlog.filter(x => x.id !== el.dataset.id); save(); render(); },
  'bl-all': () => { S.showAllBacklog = !S.showAllBacklog; render(); },
  'add-save': el => {
    const t = input('addtxt').trim(); if (!t) return; const to = el.dataset.to;
    if (to === 'backlog') { D.backlog.unshift({ id: uid(), text: t }); toast('Ajouté à ta to-do, à trier'); }
    else { const k = to === 'today' ? todayKey() : dkey(addDays(logicalNow(), 1)); if (D.focus[k]) D.backlog.unshift({ id: uid(), text: D.focus[k].text }); D.focus[k] = { text: t, done: false }; toast(to === 'today' ? "C'est ta chose du jour" : 'Prévu pour demain'); }
    save(); closeSheet(); render();
  },
  books: () => openSheet({ type: 'books' }),
  'bk-status': el => { const b = D.books.find(x => x.id === el.dataset.id); const order = ['todo', 'reading', 'done']; b.status = order[(order.indexOf(b.status) + 1) % 3]; if (b.status === 'done') b.progress = 100; save(); renderSheet(); render(); },
  'bk-add': () => { const t = (input('bknew') || '').trim(); if (!t) return; D.books.push({ id: 'b' + uid(), title: t, img: '', progress: 0, status: 'todo' }); save(); renderSheet(); },
  ex: el => openSheet({ type: 'ex', id: el.dataset.id }),
  'focus-open': el => {
    const id = el.dataset.id; if (D.timer && D.timer.start && D.timer.hid !== id) stopTimer();
    if (!D.timer || D.timer.hid !== id) D.timer = { hid: id, date: todayKey(), start: null };
    save(); S.sheet = null; S.view = 'focus'; render();
  },
  'focus-toggle': () => { const t = D.timer; if (t.start) stopTimer(); else { t.start = Date.now(); save(); } render(); },
  'focus-adj': el => { const t = D.timer, h = hById(t.hid); const running = !!t.start; if (running) stopTimer(); setVal(t.date, h, Math.max(0, Math.min(h.target, val(t.date, h) + Number(el.dataset.n)))); if (running) t.start = Date.now(); save(); render(); },
  'focus-finish': () => { const t = D.timer, h = hById(t.hid); t.start = null; setVal(t.date, h, h.target); D.timer = null; save(); S.view = 'today'; render(); toast(`${h.name} : fait`); checkCelebrate(); },
  'focus-close': () => { S.view = 'today'; render(); },
  settings: () => openSheet({ type: 'settings' }),
  'set-save': () => { D.settings.dayStart = Number(input('daystart')); save(); closeSheet(); render(); },
  export: () => {
    const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `planneur-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast('Export bloqué ici : utilise « Copier mes données »'); }
  },
  reset: () => { if (!S.sheet.confirm) { S.sheet.confirm = true; renderSheet(); return; } D = defaults(); D.since = todayKey(); save(); closeSheet(); S.view = 'today'; render(); toast('Données réinitialisées'); },
  copy: () => { try { navigator.clipboard.writeText(JSON.stringify(D)).then(() => toast('Données copiées'), () => toast('Copie refusée')); } catch (e) { toast('Copie impossible ici'); } },
};

Object.assign(A, AMB_ACTIONS, TODO_ACTIONS, EXTRA_ACTIONS, SPORT_ACTIONS, BREATH_ACTIONS, NOTE_ACTIONS, SYNC_ACTIONS, SERRE_ACTIONS, DASH_ACTIONS, MORE_ACTIONS, GOAL_ACTIONS, TCC_ACTIONS);

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'INPUT') return;
  fn(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.a === 'amb-p' || el.dataset.a === 'amb-s') { ambInput(el); return; }
  if (el.id === 'nsearch') { noteFilter(el.value); return; }
  if (el.dataset.a === 'bk-prog') { const b = D.books.find(x => x.id === el.dataset.id); b.progress = Number(el.value); if (b.progress > 0 && b.status === 'todo') b.status = 'reading'; el.nextElementSibling.textContent = b.progress + ' %'; save(); }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.a === 'bk-prog') render();
  if (ev.target.id === 'importfile') {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); if (!d.habits || !d.themes) throw new Error(); D = d; save(); closeSheet(); render(); toast('Données importées'); }).catch(() => toast('Fichier illisible'));
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'lgtoken') { ev.preventDefault(); A['login-go'](); return; }
  if (ev.key === 'Enter' && ev.target.id === 'gstep') { ev.preventDefault(); A['goal-sadd'](); return; }
  if (ev.key === 'Enter' && ev.target.id === 'msval') { ev.preventDefault(); A['ms-save'](); return; }
  if (ev.key === 'Enter' && ev.target.id === 'tdnew') { ev.preventDefault(); A['td-add'](); return; }
  if (ev.key === 'Escape' && S.sheet) closeSheet();
  if (ev.key === 'Enter' && !ev.shiftKey && S.sheet && (ev.target.id === 'addtxt' || ev.target.id === 'onetxt')) { ev.preventDefault(); ev.target.id === 'addtxt' ? A['add-save']({ dataset: { to: 'backlog' } }) : A['one-save'](); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { returnMissedFocus(); if (!S.sheet && S.view !== 'login') render(); syncPull(); } else if (D._dirty) syncPush(); });
window.addEventListener('online', () => { if (D._dirty) syncPush(); else syncPull(); });
let lastWide = window.innerWidth >= 1000;
window.addEventListener('resize', () => { const w = window.innerWidth >= 1000; if (w !== lastWide) { lastWide = w; if (['today', 'week'].includes(S.view) && !S.sheet) render(); } });

load(); if (!D.since) { D.since = todayKey(); save(); } returnMissedFocus();
S.medit = initMedit();
setInterval(() => { if (SND.playing && SND.endAt && Date.now() >= SND.endAt) sndStop(true); }, 1000);
lastDayFull = (() => { const dp = dayProgress(todayKey()); return dp.total > 0 && dp.done === dp.total; })();
if (D.timer && D.timer.start) S.view = 'focus';
if (!SY.user) S.view = 'login';
render();
setInterval(tickFocus, 1000);
syncInit();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}); } catch (e) { } }

</script>
</body>
</html>
